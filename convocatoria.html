<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Convocatoria Tomiño F.C. Veteranos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: cabecera granate con escudo, pestañas fijas, contenido a todo el ancho; la convocatoria se pinta como camisetas */
:root{
  --bg:#f6f3f3; --surface:#ffffff; --ink:#1d1414; --muted:#6c5858; --line:#e4d9d9;
  --grana:#8a1712; --grana-deep:#4f0c0a; --grana-ink:#ffffff; --gold:#d9a521; --gold-ink:#2a1d00; --soft:#f3e7e6; --ok:#2d7a46; --no:#9b9090;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19; --ok:#4fae6c; --no:#6f6260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19; --ok:#4fae6c; --no:#6f6260; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
p,.just{text-align:justify;hyphens:auto}
header{background:radial-gradient(120% 140% at 15% 0%, var(--grana) 0%, var(--grana-deep) 75%);color:var(--grana-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;align-items:center;gap:14px}
header img{width:64px;height:auto;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);flex:none}
header .club{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;opacity:.85}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.05;margin:2px 0 0;text-transform:uppercase}
header .next{font-size:.95rem;opacity:.9;margin-top:2px}
nav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding-top:env(safe-area-inset-top,0px)}
nav button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 .98rem var(--body);padding:13px 14px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--grana)}
main{padding-inline:16px;padding-block:18px 60px}
section{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:600;font-size:1.55rem;text-transform:uppercase;margin:0;line-height:1.15;text-wrap:balance}
h3{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.muted{color:var(--muted)} .note{font-size:.9rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 .95rem var(--body);cursor:pointer;background:var(--grana);color:var(--grana-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;background:var(--soft);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok);color:#fff} .chip.gold{background:var(--gold);color:var(--gold-ink)} .chip.grana{background:var(--grana);color:var(--grana-ink)}
.status{border-radius:12px;padding:14px 16px;font-weight:600;text-align:justify}
.status.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.status.over{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:600;font-size:1.15rem;width:2.2ch;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--body);padding:7px 11px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.y{background:var(--ok);color:#fff}
.seg button.on.n{background:var(--no);color:#fff}
.shirts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.shirt{position:relative;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.shirt svg{width:76px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.shirt .sn{font-size:.85rem;font-weight:600;text-align:center;line-height:1.2;overflow-wrap:anywhere;max-width:100%}
.shirt .badge{position:absolute;top:-4px;right:6px;background:var(--gold);color:var(--gold-ink);font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 7px}
.shirt.bench svg path.body{fill:var(--soft);stroke:var(--line)}
.shirt.bench text{fill:var(--muted)}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--gold-ink);flex:none}
.tag.coach{background:var(--grana);color:var(--grana-ink)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;width:30px;height:30px;font-weight:700;cursor:pointer;flex:none}
.empty{padding:20px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:justify}
.drop{border:2px dashed var(--grana);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--grana) 6%,var(--surface))}
.drop.over{background:color-mix(in srgb,var(--grana) 16%,var(--surface))}
textarea{width:100%;min-height:150px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;text-align:center;z-index:20}
.home{color:var(--grana-ink);font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;align-self:flex-start;flex:none}
.match{border-left:6px solid var(--grana)}
.aviso{background:color-mix(in srgb,var(--gold) 20%,var(--surface));border-radius:8px;padding:8px 12px;font-weight:600;font-size:.92rem;text-align:justify}
.counters{display:flex;align-items:center;gap:4px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* Fusiona los datos de las actas de la federación con lo guardado en este navegador */
function syncData(){
  const byKey=n=>D.people.find(p=>p.fed===n||p.name===n);
  DATA.plantilla.forEach(fp=>{
    let p=byKey(fp.nombre);
    if(!p){ p={id:uid(),name:fp.nombre,fed:fp.nombre,dorsal:"",role:"jugador",played:0,benched:0,lastOut:""}; D.people.push(p); }
    p.fed=fp.nombre; if(fp.dorsal!=null) p.dorsal=String(fp.dorsal);
  });
  DATA.cuerpoTecnico.forEach(c=>{ let p=byKey(c.nombre); if(!p) D.people.push({id:uid(),name:c.nombre,fed:c.nombre,dorsal:"",role:"entrenador",played:0,benched:0,lastOut:""}); else p.role="entrenador"; });
  DATA.partidos.forEach(m=>{
    const ids=m.titulares.concat(m.suplentes).map(x=>byKey(x.nombre)).filter(Boolean).map(p=>p.id);
    let h=D.history.find(x=>x.date===m.fecha);
    if(h && h.fed) return;
    if(h){ h.inn.forEach(i=>{const p=D.people.find(x=>x.id===i); if(p) p.played=Math.max(0,(p.played||0)-1);}); h.inn=ids; h.fed=true; }
    else { D.history.push({date:m.fecha,inn:ids,out:[],prevLast:D.lastMatch,fed:true}); D.history.sort((a,b)=>a.date<b.date?-1:1); }
    ids.forEach(i=>{const p=D.people.find(x=>x.id===i); p.played=(p.played||0)+1;});
    if(m.fecha>(D.lastMatch||"")) D.lastMatch=m.fecha;
  });
  const done=new Set(D.history.map(h=>h.date)), today=iso(new Date());
  if(!D.next || done.has(D.next)){ const nx=DATA.calendario.find(c=>c.fecha>=today && !done.has(c.fecha)) || DATA.calendario.find(c=>!done.has(c.fecha)); D.next=nx?nx.fecha:nextSaturday(); }
}

const corto=n=>{ const i=n.indexOf(", "); if(i<0) return n; return n.slice(i+2)+" "+n.slice(0,i).split(" ")[0]; };
function matchInfo(c){
  if(!c) return null;
  const notas=[];
  if(c.superficie==="Tierra") notas.push("Campo de tierra: llevad botas de tacos");
  if(!c.enCasa && /roj/.test(c.camisetaRival)) notas.push("El rival viste de "+c.camisetaRival+": probablemente toque la 2ª equipación (azul turquesa)");
  return {titulo:(c.enCasa?"Tomiño F.C. – ":"")+c.rival+(c.enCasa?"":" – Tomiño F.C."), notas};
}

function proposal(){
  const avail=players().filter(p=>av(p.id)==="y");
  const lim=Number(D.limit)||18, f=forcedSet();
  if(avail.length<=lim) return {inn:avail.slice().sort(byName), out:[], avail, over:false};
  const outLast=p=>(p.lastOut&&p.lastOut===D.lastMatch)?1:0;
  const sorted=avail.slice().sort((a,b)=> (f.has(b.id)-f.has(a.id)) || outLast(b)-outLast(a) || (b.benched||0)-(a.benched||0) || (a.played||0)-(b.played||0) || byName(a,b));
  return {inn:sorted.slice(0,lim).sort(byName), out:sorted.slice(lim).sort(byName), avail, over:true};
}
function reason(p){
  if(p.lastOut&&p.lastOut===D.lastMatch) return "descansó la última vez";
  return `${p.played||0} convocatorias, ${p.benched||0} descansos`;
}

  if(!players().length){ el.innerHTML=h+`<div class="empty">Todavía no hay jugadores. Ve a la pestaña Plantilla para añadirlos a mano o importarlos desde Excel.</div>`; return; }
  const pr=proposal(), pend=players().filter(p=>!av(p.id)).length, no=players().filter(p=>av(p.id)==="n").length;
  h+=`<div class="chips"><span class="chip ok">${pr.avail.length} van</span><span class="chip">${no} no pueden</span>${pend?`<span class="chip gold">${pend} sin responder</span>`:""}</div>`;
  h+=`<div class="panel"><div class="row between"><h3>¿Quién puede ir?</h3><div class="row" style="gap:6px"><button class="btn ghost sm" data-a="allYes">Todos van</button><button class="btn ghost sm" data-a="clearAv">Limpiar</button></div></div>
    <ul class="list">${players().slice().sort(byName).map(p=>{const a=av(p.id);return `<li><span class="num">${esc(p.dorsal||"")}</span><span class="name">${esc(nice(p.name))}</span>
    <span class="seg"><button class="y ${a==="y"?"on":""}" data-a="av" data-id="${p.id}" data-v="y">Va</button><button class="n ${a==="n"?"on":""}" data-a="av" data-id="${p.id}" data-v="n">No</button></span></li>`}).join("")}</ul></div>`;
  h+= pr.over
    ? `<div class="status over">Hay ${pr.avail.length} disponibles y el máximo es ${lim}: esta semana descansan ${pr.out.length}. Descansan primero los que más partidos llevan, y quien descansó la última vez entra seguro.</div>`
    : `<div class="status ok">Hay ${pr.avail.length} disponibles y el máximo es ${lim}: van todos, no hace falta rotar.</div>`;
  h+=`<div class="panel"><div class="row between"><h2>Convocados · ${pr.inn.length}</h2>${coaches().length?`<span class="note">Cuerpo técnico: ${coaches().map(c=>esc(corto(c.name))).join(", ")}</span>`:""}</div>
    ${pr.inn.length?`<div class="shirts">${pr.inn.map(p=>shirt(p,false)).join("")}</div>`:`<p class="muted">Marca quién puede ir en la lista de arriba.</p>`}`;
  if(pr.out.length) h+=`<h3>Descansan · plaza asegurada el próximo sábado</h3><div class="shirts">${pr.out.map(p=>shirt(p,true)).join("")}</div>
    <p class="note">Toca a un jugador que descansa para meterlo como fijo; saldrá el siguiente en la rotación. Toca un convocado marcado como fijo para quitarle esa marca.</p>
    <ul class="list">${pr.out.map(p=>`<li><span class="name">${esc(nice(p.name))}</span><span class="stat">${reason(p)}</span></li>`).join("")}</ul>`;
  h+=`<div class="row"><button class="btn gold" data-a="copy">Copiar para WhatsApp</button>
    ${UI.confirm?`<span class="note">Se sumará una convocatoria a los ${pr.inn.length} convocados${pr.out.length?` y un descanso a los ${pr.out.length} que descansan`:""}.</span><button class="btn" data-a="closeYes">Sí, cerrar</button><button class="btn ghost" data-a="closeNo">Cancelar</button>`
    :`<button class="btn" data-a="close" ${pr.inn.length?"":"disabled"}>Cerrar convocatoria</button>`}</div>
    ${UI.copy?`<label class="f" for="copyBox">Selecciona y copia el texto<textarea id="copyBox" readonly>${esc(UI.copy)}</textarea></label>`:""}</div>`;
  el.innerHTML=h;
}

function rSquad(){
  const el=$("#t-plantilla");
  let h=`<div class="panel"><h3>Importar desde Excel o CSV</h3>
    <label class="drop" id="drop" for="inFile"><b>Toca para elegir el archivo</b> o arrástralo aquí<br><span class="note">Columnas que reconoce: Nombre, Dorsal y Rol (escribe «Entrenador» en Rol para el cuerpo técnico).</span></label>
    <input type="file" id="inFile" accept=".xlsx,.xls,.csv,.ods,.txt" hidden>
    ${UI.preview?`<div class="panel" style="background:var(--soft)"><b>${UI.preview.length} personas encontradas</b>
      <ul class="list">${UI.preview.slice(0,40).map(p=>`<li><span class="num">${esc(p.dorsal)}</span><span class="name">${esc(nice(p.name))}</span>${p.role==="entrenador"?`<span class="tag coach">Entrenador</span>`:""}${p.dup?`<span class="tag">ya está</span>`:""}</li>`).join("")}</ul>
      <div class="row"><button class="btn" data-a="importYes">Añadir a la plantilla</button><button class="btn ghost" data-a="importNo">Cancelar</button></div></div>`:""}
    <details><summary class="note" style="cursor:pointer">O pega una lista de nombres</summary>
      <p class="note">Un nombre por línea. Puedes añadir el dorsal y el rol separados por punto y coma: «Manolo Pérez;7» o «Javi Costas;;Entrenador».</p>
      <textarea id="inPaste" placeholder="Nombre;Dorsal;Rol"></textarea>
      <div class="row"><button class="btn ghost" data-a="paste">Revisar lista</button></div></details></div>`;
  h+=`<form class="panel" id="addForm"><h3>Añadir a mano</h3><div class="row">
    <label class="f" for="inName" style="flex:1 1 12em">Nombre<input id="inName" maxlength="40" required></label>
    <label class="f" for="inDorsal">Dorsal<input id="inDorsal" maxlength="3" style="width:5em"></label>
    <label class="f" for="inRole">Rol<select id="inRole"><option value="jugador">Jugador</option><option value="entrenador">Entrenador</option></select></label>
    <button class="btn" type="submit" style="align-self:flex-end">Añadir</button></div></form>`;
  if(!D.people.length){ el.innerHTML=h+`<div class="empty">La plantilla está vacía.</div>`; return; }
  const item=p=>`<li><span class="num">${esc(p.dorsal||"")}</span><span class="name">${esc(nice(p.name))}</span>
    ${p.lastOut&&p.lastOut===D.lastMatch?`<span class="tag">descansó</span>`:""}
    ${p.role!=="entrenador"?`<span class="counters"><button class="mini" data-a="adj" data-id="${p.id}" data-f="played" data-n="-1" aria-label="Restar convocatoria">−</button><span class="stat">${p.played||0} C</span><button class="mini" data-a="adj" data-id="${p.id}" data-f="played" data-n="1" aria-label="Sumar convocatoria">+</button>
    <button class="mini" data-a="adj" data-id="${p.id}" data-f="benched" data-n="-1" aria-label="Restar descanso">−</button><span class="stat">${p.benched||0} D</span><button class="mini" data-a="adj" data-id="${p.id}" data-f="benched" data-n="1" aria-label="Sumar descanso">+</button></span>`:""}
    ${UI.delAsk===p.id?`<button class="btn sm" data-a="delYes" data-id="${p.id}">Quitar</button>`:`<button class="mini" data-a="del" data-id="${p.id}" aria-label="Quitar de la plantilla">×</button>`}</li>`;
  h+=`<div class="panel"><div class="row between"><h2>Jugadores · ${players().length}</h2><span class="note">C = convocatorias · D = descansos</span></div><ul class="list">${players().slice().sort(byName).map(item).join("")}</ul></div>`;
  if(coaches().length) h+=`<div class="panel"><h2>Cuerpo técnico · ${coaches().length}</h2><ul class="list">${coaches().slice().sort(byName).map(item).join("")}</ul></div>`;
  el.innerHTML=h; bindDrop();
}

function rHist(){
  const el=$("#t-historial"); const nm=id=>{const p=D.people.find(p=>p.id===id); return p?corto(p.name):"(baja)";};
  let h=`<h2>Historial</h2>`;
  if(!D.history.length){ el.innerHTML=h+`<div class="empty">Cada vez que cierres una convocatoria aparecerá aquí, con quién fue y quién descansó.</div>`; return; }
  h+=D.history.slice().reverse().map((m,i)=>`<div class="panel"><div class="row between"><b>${esc(fmtD(m.date,true))}</b><span class="chips"><span class="chip grana">${m.inn.length} convocados</span>${m.out.length?`<span class="chip gold">${m.out.length} descansan</span>`:""}</span></div>
    <p class="note">${m.inn.map(id=>esc(nm(id))).join(", ")}.</p>
    ${m.out.length?`<p class="note"><b>Descansaron:</b> ${m.out.map(id=>esc(nm(id))).join(", ")}.</p>`:""}
    ${m.fed?`<p class="note">Datos del acta de la federación.</p>`:i===0?(UI.undoAsk?`<div class="row"><span class="note">Se restarán los contadores de este partido.</span><button class="btn sm" data-a="undoYes">Sí, deshacer</button><button class="btn ghost sm" data-a="undoNo">No</button></div>`:`<div class="row"><button class="btn ghost sm" data-a="undo">Deshacer esta convocatoria</button></div>`):""}</div>`).join("");
  el.innerHTML=h;
}

function rData(){
  $("#t-datos").innerHTML=`<h2>Datos</h2>
  <p class="muted">Todo se guarda en este navegador. Si cambias de móvil u ordenador, o quieres que otra persona lleve la convocatoria, descarga una copia y ábrela allí.</p>
  <div class="panel"><h3>Copia de seguridad</h3><div class="row"><button class="btn" data-a="export">Descargar copia</button>
  <label class="btn ghost" for="inBackup" style="display:inline-block">Cargar copia</label><input type="file" id="inBackup" accept=".json" hidden></div></div>
  <div class="panel"><h3>Nueva temporada</h3><p class="note">Pone a cero convocatorias y descansos y borra el historial. La plantilla se mantiene.</p>
  ${UI.wipeAsk?`<div class="row"><button class="btn" data-a="wipeYes">Sí, poner a cero</button><button class="btn ghost" data-a="wipeNo">Cancelar</button></div>`:`<div class="row"><button class="btn ghost" data-a="wipe">Empezar temporada nueva</button></div>`}</div>`;
}

function waText(){
  const pr=proposal(), fx=fixture(), mi=matchInfo(fx);
  let t=`*TOMIÑO F.C. VETERANOS*\n`;
  if(fx) t+=`Jornada ${fx.jornada}: ${mi.titulo}\n${fmtD(fx.fecha,true)}${fx.hora?", "+fx.hora+" h":""}\nCampo: ${fx.campo}\n`+mi.notas.map(n=>"⚠️ "+n+"\n").join("");
  else t+=`Partido del ${fmtD(D.next,true)}\n`;
  t+=`\n*Convocados (${pr.inn.length})*\n`+pr.inn.slice().sort((x,y)=>(parseInt(x.dorsal)||999)-(parseInt(y.dorsal)||999)).map(p=>`${p.dorsal?p.dorsal+". ":"- "}${corto(p.name)}`).join("\n");
  if(coaches().length) t+=`\n\nCuerpo técnico: `+coaches().map(c=>corto(c.name)).join(", ");
  if(pr.out.length) t+=`\n\n*Descansan* (plaza asegurada el próximo sábado):\n`+pr.out.map(p=>"- "+corto(p.name)).join("\n");
  const pend=players().filter(p=>!av(p.id)); if(pend.length) t+=`\n\nSin responder: `+pend.map(p=>corto(p.name)).join(", ");
  return t;
}

/* ---- importación ---- */
function rowsToPeople(rows){
  rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(c=>c));
  if(!rows.length) return [];
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  let hi=rows.findIndex(r=>r.some(c=>/^(nombre|jugador|apellidos|nome)/.test(norm(c))));
  let cN=0,cA=-1,cD=-1,cR=-1,start=0;
  if(hi>=0){ const r=rows[hi].map(norm); start=hi+1;
    cN=r.findIndex(c=>/^(nombre|jugador|nome)/.test(c)); cA=r.findIndex(c=>/^apellido/.test(c));
    cD=r.findIndex(c=>/dorsal|^n(u|º|o)?m|^n\.?º?$/.test(c)); cR=r.findIndex(c=>/rol|cargo|tipo|puesto|funcion/.test(c));
    if(cN<0) cN=cA>=0?cA:0;
  } else { if(rows[0].length>1 && /^\d{1,3}$/.test(rows[0][0]) && !/^\d+$/.test(rows[0][1])){cN=1;cD=0;} else {cN=0; cD=rows[0].length>1?1:-1;} }
  const existing=new Set(D.people.map(p=>norm(p.name)));
  return rows.slice(start).map(r=>{
    let name=r[cN]||""; if(cA>=0&&cA!==cN&&r[cA]) name=(name+" "+r[cA]).trim();
    const role=cR>=0&&/entren|tecnic|delegad|prepar|coach|adestr/.test(norm(r[cR]||""))?"entrenador":"jugador";
    const dorsal=cD>=0?(r[cD]||"").replace(/\.0$/,""):"";
    return {name, dorsal:/^\d{0,3}$/.test(dorsal)?dorsal:"", role, dup:existing.has(norm(name))};
  }).filter(p=>p.name && p.name.length<60);
}
function handleFile(file){
  if(!file) return;
  const isCsv=/\.(csv|txt)$/i.test(file.name);
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let rows;
      if(isCsv){ const txt=rd.result; const sep=(txt.split("\n")[0].match(/;/g)||[]).length>=(txt.split("\n")[0].match(/,/g)||[]).length?";":","; rows=txt.split(/\r?\n/).map(l=>l.split(sep)); }
      else { if(!window.XLSX){ toast("Para leer Excel hace falta conexión a internet. Prueba a guardarlo como CSV."); return; }
        const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}); }
      UI.preview=rowsToPeople(rows); if(!UI.preview.length){ UI.preview=null; toast("No he encontrado nombres en el archivo"); } render();
    }catch(e){ toast("No se pudo leer el archivo"); }
  };
  isCsv?rd.readAsText(file):rd.readAsArrayBuffer(file);
}
function bindDrop(){
  const d=$("#drop"); if(!d) return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>handleFile(e.dataTransfer.files[0]));
}

/* ---- eventos ---- */
document.addEventListener("click", async e=>{
  const tb=e.target.closest("nav button"); if(tb){ UI.tab=tb.dataset.tab; UI.copy=""; try{localStorage.setItem(KEY+"_tab",UI.tab)}catch(x){} render(); window.scrollTo(0,0); return; }
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return; const a=b.dataset.a, id=b.dataset.id;
  const P=()=>D.people.find(p=>p.id===id);
  switch(a){
    case "av": { D.avail[D.next]=D.avail[D.next]||{}; const cur=D.avail[D.next][id]; D.avail[D.next][id]= cur===b.dataset.v?undefined:b.dataset.v; if(!D.avail[D.next][id]) delete D.avail[D.next][id]; UI.confirm=false; break; }
    case "allYes": D.avail[D.next]={}; players().forEach(p=>D.avail[D.next][p.id]="y"); break;
    case "clearAv": D.avail[D.next]={}; D.forced[D.next]=[]; break;
    case "force": { const f=forcedSet(); f.add(id); D.forced[D.next]=[...f]; toast(P().name+" entra como fijo"); break; }
    case "unforce": { const f=forcedSet(); if(!f.has(id)) return; f.delete(id); D.forced[D.next]=[...f]; break; }
    case "copy": UI.copy=waText(); try{ await navigator.clipboard.writeText(UI.copy); UI.copy=""; toast("Copiado. Pégalo en el grupo de WhatsApp."); }catch(x){ render(); const t=$("#copyBox"); if(t){t.focus();t.select();} return; } break;
    case "close": UI.confirm=true; break;
    case "closeNo": UI.confirm=false; break;
    case "closeYes": {
      const pr=proposal(), date=D.next;
      pr.inn.forEach(p=>p.played=(p.played||0)+1);
      pr.out.forEach(p=>{ p.benched=(p.benched||0)+1; p.prevLastOut=p.lastOut||""; p.lastOut=date; });
      D.history.push({date, inn:pr.inn.map(p=>p.id), out:pr.out.map(p=>p.id), prevLast:D.lastMatch});
      D.lastMatch=date; { const done=new Set(D.history.map(h=>h.date)); const nx=DATA.calendario.find(c=>c.fecha>date&&!done.has(c.fecha)); D.next=nx?nx.fecha:addDays(date,7); } UI.confirm=false; toast("Convocatoria cerrada. Ya está preparada la del "+fmtD(D.next)); break; }
    case "undo": UI.undoAsk=true; break;
    case "undoNo": UI.undoAsk=false; break;
    case "undoYes": {
      const m=D.history.pop(); if(!m) break;
      m.inn.forEach(i=>{const p=D.people.find(x=>x.id===i); if(p) p.played=Math.max(0,(p.played||0)-1);});
      m.out.forEach(i=>{const p=D.people.find(x=>x.id===i); if(p){ p.benched=Math.max(0,(p.benched||0)-1); p.lastOut=p.prevLastOut||""; }});
      D.lastMatch=m.prevLast||""; D.next=m.date; UI.undoAsk=false; toast("Convocatoria deshecha"); break; }
    case "adj": { const p=P(); p[b.dataset.f]=Math.max(0,(p[b.dataset.f]||0)+Number(b.dataset.n)); break; }
    case "del": UI.delAsk=id; break;
    case "delYes": D.people=D.people.filter(p=>p.id!==id); UI.delAsk=null; break;
    case "paste": { const t=$("#inPaste").value; UI.preview=rowsToPeople(t.split(/\r?\n/).map(l=>l.split(/[;\t]/))); if(!UI.preview.length){UI.preview=null; toast("No hay nombres en la lista");} break; }
    case "importYes": { const add=UI.preview.filter(p=>!p.dup); add.forEach(p=>D.people.push({id:uid(),name:p.name,dorsal:p.dorsal,role:p.role,played:0,benched:0,lastOut:""}));
      const c=add.filter(p=>p.role==="entrenador").length; toast(`Añadidos ${add.length-c} jugadores${c?` y ${c} del cuerpo técnico`:""}`); UI.preview=null; break; }
    case "importNo": UI.preview=null; break;
    case "export": { const blob=new Blob([JSON.stringify(D,null,1)],{type:"application/json"}); const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download="convocatoria_tomino_copia_"+iso(new Date())+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast("Copia descargada"); return; }
    case "wipe": UI.wipeAsk=true; break;
    case "wipeNo": UI.wipeAsk=false; break;
    case "wipeYes": D.people.forEach(p=>{p.played=0;p.benched=0;p.lastOut="";}); D.history=[]; D.lastMatch=""; D.avail={}; D.forced={}; UI.wipeAsk=false; toast("Temporada nueva preparada"); break;
    default: return;
  }
  save(); render();
});
document.addEventListener("change", e=>{
  if(e.target.id==="inDate" && e.target.value){ D.next=e.target.value; UI.confirm=false; save(); render(); }
  if(e.target.id==="inLimit"){ D.limit=Math.max(11,Math.min(30,parseInt(e.target.value)||18)); save(); render(); }
  if(e.target.id==="inFile"){ handleFile(e.target.files[0]); e.target.value=""; }
  if(e.target.id==="inBackup"){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.people)) throw 0; D=d; save(); toast("Copia cargada"); render(); }catch(x){ toast("Ese archivo no es una copia válida"); } }; r.readAsText(f); }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="addForm") return; e.preventDefault();
  const n=$("#inName").value.trim(); if(!n) return;
  D.people.push({id:uid(), name:n, dorsal:$("#inDorsal").value.trim(), role:$("#inRole").value, played:0, benched:0, lastOut:""});
  save(); render(); toast(n+" añadido"); const i=$("#inName"); if(i) i.focus();
});
syncData(); save(); render();
</script>
