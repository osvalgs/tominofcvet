<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votación Tomiño F.C. Veteranos</title>
<meta name="description" content="Votación anónima do equipo. Unha soa vez por persoa.">
<meta property="og:title" content="Tomiño F.C. Veteranos · Votación do equipo">
<meta property="og:description" content="Vota de forma anónima desde o teu móbil. Só se pode votar unha vez.">

<style>
/* Layout: cabecera granate con escudo y próximo partido; contenido a todo el ancho en tarjetas de borde fino */
:root{
  --bg:#f6f3f3; --surface:#ffffff; --ink:#1d1414; --muted:#6c5858; --line:#e4d9d9;
  --grana:#8a1712; --grana-deep:#4f0c0a; --grana-ink:#ffffff; --gold:#d9a521; --gold-ink:#2a1d00; --soft:#f3e7e6;
  --ok:#2d7a46; --no:#9b4a43; --draw:#8c7b52; --pend:#b9a9a7;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19;
  --ok:#4fae6c; --no:#d9776d; --draw:#b3a374; --pend:#6f6260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19;
  --ok:#4fae6c; --no:#d9776d; --draw:#b3a374; --pend:#6f6260; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
p{text-align:justify;hyphens:auto;margin:0}
a{color:inherit}
.hero{background:radial-gradient(120% 140% at 10% 0%, var(--grana) 0%, var(--grana-deep) 80%);color:var(--grana-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:auto;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);flex:none}
.brand .sub{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;opacity:.85}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.05;margin:2px 0 0;text-transform:uppercase}
.brand .grow{flex:1;min-width:0}
.pill-link{color:var(--grana-ink);font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;font-size:.9rem;flex:none;align-self:flex-start}
.next{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.next .lbl{font:700 .75rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.next .vs{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,5.4vw,2rem);line-height:1.15;text-transform:uppercase;text-wrap:balance}
.next .meta{opacity:.95;font-size:1.02rem}
.next .meta b{font-weight:700}
.next .aviso{background:var(--gold);color:var(--gold-ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.9rem;text-align:justify}
.next .nota{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:.95rem;text-align:justify}
.maps{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--grana-deep);font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;align-self:flex-start}
.maps svg{width:18px;height:18px}
main{padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;text-transform:uppercase;margin:0;line-height:1.15;text-wrap:balance}
h3{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.muted{color:var(--muted)} .note{font-size:.88rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 .95rem var(--body);cursor:pointer;background:var(--grana);color:var(--grana-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;background:var(--soft);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok);color:#fff} .chip.no{background:var(--no);color:#fff} .chip.gold{background:var(--gold);color:var(--gold-ink)} .chip.grana{background:var(--grana);color:var(--grana-ink)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:600;font-size:1.1rem;width:2.2ch;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--body);padding:7px 11px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.y{background:var(--ok);color:#fff}
.seg button.on.n{background:var(--no);color:#fff}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;text-align:justify;background:color-mix(in srgb,var(--gold) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.banner.err{background:color-mix(in srgb,var(--no) 14%,var(--surface));border-color:color-mix(in srgb,var(--no) 40%,transparent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;text-align:center;z-index:20}
.sync{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.card.y{background:#f2c200} .card.r{background:#d8261c}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#08331a;font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;border:0;font-size:.95rem;cursor:pointer}
.wa svg{width:18px;height:18px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--gold-ink);flex:none}
/* Os despregables non poden saír do marxe aínda que o texto da opción sexa longo */
label.f{min-width:0;max-width:100%}
label.f select{width:100%;max-width:100%;min-width:0;text-overflow:ellipsis}
.row>*{min-width:0;max-width:100%}

.q{font:600 1.5rem var(--display);line-height:1.2;text-transform:none;margin:0;text-wrap:balance;text-align:left}
.optlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.optlist li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:10px 12px}
.optlist li b{font:700 1.2rem var(--display);color:var(--grana);width:1.2em;flex:none;line-height:1.2}
.votebtn{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--grana);color:var(--grana-ink);text-decoration:none;font:700 1.25rem var(--display);text-transform:uppercase;letter-spacing:.04em;border-radius:14px;padding:16px}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font:700 2.4rem var(--display);color:var(--grana);line-height:1}
.state{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.state.open{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.state.closed{background:var(--grana);color:var(--grana-ink)}
.deadline{font-weight:700}
.res{display:grid;gap:14px}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums}
.ritem .l{font:700 1.5rem var(--display);color:var(--grana);width:1.2em}
.ritem .n{font:700 1.5rem var(--display)}
.ritem .bar{grid-column:1/-1;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.ritem .bar i{display:block;height:100%;background:var(--grana);border-radius:7px;transition:width .6s ease}
.ritem.win .bar i{background:var(--gold)} .ritem.win .l{color:var(--gold)}
textarea{width:100%;min-height:90px}
.coach{border:2px dashed var(--line)}
.coach summary{cursor:pointer;font-weight:700;color:var(--muted)}
.coach[open]{border-style:solid;border-color:var(--grana)}
footer{padding:0 16px 30px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--muted)}
</style>
</head>

  /* Unha votación pechada que o adestrador eliminou xa non se amosa a ninguén */
  let vot=j.votacion||null; const oc=pa.VOT_OCULTA; if(vot&&oc&&oc.nota&&String(vot.creada)===String(oc.nota)) vot=null;
  return {avail:av,convocatorias:(j.convocatorias||[]).map(c=>({...c,fecha:normFecha(c.fecha)})),partidos:pa,votacion:vot};
}
/* Mentres hai gardados en curso non se aplican lecturas que poidan estar atrasadas;
   ao rematar o último gárdado vólvese ler sempre, aínda que algún fallase */
let PENDING=0, REFETCH=false;
let onShared=()=>{};
/* Copia local da última lectura: amósase ao momento mentres chega a da folla */
const CACHE_KEY="tomino_cache_v1";
function saveCache(){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify({avail:SHARED.avail,convocatorias:SHARED.convocatorias,partidos:SHARED.partidos,votacion:SHARED.votacion,at:Date.now()})); }catch(e){} }
(function(){ try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c&&Date.now()-c.at<7*864e5){ Object.assign(SHARED,{avail:c.avail||{},convocatorias:c.convocatorias||[],partidos:c.partidos||{},votacion:c.votacion||null,stale:true}); } }catch(e){} })();
async function apiGet(){
  if(!apiReady()){ SHARED.error="noapi"; return SHARED; }
  try{ const r=await fetch(API+"?t="+Date.now()); const j=await r.json();
    if(PENDING){ REFETCH=true; return SHARED; }
    Object.assign(SHARED,normalize(j),{ok:true,error:null,at:new Date(),stale:false}); saveCache(); }
  catch(e){ SHARED.error="red"; }
  return SHARED;
}
async function apiPost(body){
  if(!apiReady()) throw {error:"noapi"};
  PENDING++;
  try{ const r=await fetch(API,{method:"POST",body:JSON.stringify(body)});
    const j=await r.json(); if(!j.ok) throw j;
    if(PENDING===1&&j.avail){ Object.assign(SHARED,normalize(j),{ok:true,error:null,at:new Date(),stale:false}); saveCache(); } else REFETCH=true;
    return j; }
  finally{ PENDING--; if(PENDING===0&&REFETCH){ REFETCH=false; apiGet().then(()=>onShared()); } }
}
function syncText(){
  if(SHARED.error==="noapi") return "A folla compartida aínda non está conectada.";
  if(SHARED.error==="red") return "Sen conexión coa folla compartida. Volverase intentar nun momento.";
  if(!SHARED.at) return SHARED.stale?"Actualizando… (amosando a última copia)":"Cargando…";
  return "Actualizado ás "+SHARED.at.toLocaleTimeString("gl-ES",{hour:"2-digit",minute:"2-digit"});
}
function heroNext(el,c,extra){
  if(!c){ el.innerHTML=`<span class="lbl">Primeira fase rematada</span><span class="meta">O calendario da seguinte fase engadirase cando o publique a federación.</span>`; return; }
  const p=SHARED.partidos[c.fecha]||{}, hora=p.hora||c.hora;
  const days=Math.round((parseD(c.fecha)-parseD(TODAY))/864e5);
  el.innerHTML=`<span class="lbl">Xornada ${c.jornada} · ${c.enCasa?"na casa":"fóra"} · ${days===0?"hoxe":days===1?"mañá":"en "+days+" días"}</span>
    <span class="vs">${esc(vsText(c))}</span>
    <span class="meta"><b>${esc(fmtD(c.fecha))}</b> · ${hora?"<b>"+esc(hora)+" h</b>":"hora por confirmar"}</span>
    <span class="meta">${esc(c.campo)}${c.superficie?" · "+c.superficie.toLowerCase():""}</span>
    ${notaDe(c).split("\n").filter(Boolean).map(n=>`<span class="nota">${esc(n)}</span>`).join("")}
    ${avisos(c).map(a=>`<span class="aviso">${esc(a)}</span>`).join("")}
    <a class="maps" href="${c.maps}" target="_blank" rel="noopener">${PIN_SVG}Como chegar</a>${extra||""}`;
}

/* Estados de asistencia */
const ESTADOS={va:"Vou",tarde:"Chego tarde",antes:"Marcho antes",no:"Non vou"};
const VAI=e=>e==="va"||e==="tarde"||e==="antes";
const SEN_RESPOSTA="-";
const SITE="https://osvalgs.github.io/tominofcvet/";
const WA_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.4-.7-2-1.3-.5-.5-1-1.1-1.3-1.7-.1-.2 0-.4.1-.5l.4-.4.3-.5v-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.3.3-1 1-1 2.3s1 2.7 1.1 2.9c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
function waLink(t){ return "https://wa.me/?text="+encodeURIComponent(t); }

let PIN="", PINOK=false; try{ const L=JSON.parse(localStorage.getItem("tomino_entrenador")||"{}"); PIN=L.pin||""; PINOK=!!(L.ok&&L.pin); }catch(e){}
const UIV={busy:false};
const DEF_Q="Como facemos as convocatorias?";
const DEF_OPTS=["Imos todos os dispoñibles, sexamos os que sexamos","Máximo de convocados con rotación: o adestrador decide e quen descansa xoga o sábado seguinte"];
function defDeadline(){ const d=new Date(); d.setDate(d.getDate()+2); d.setHours(21,0,0,0); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtAta(ms){ const d=new Date(ms); return d.toLocaleDateString("gl-ES",{weekday:"long",day:"numeric",month:"long"})+" ás "+d.toLocaleTimeString("gl-ES",{hour:"2-digit",minute:"2-digit"}); }
function quedan(ms){ const s=Math.max(0,ms-Date.now()); const d=Math.floor(s/864e5), h=Math.floor(s%864e5/36e5), m=Math.floor(s%36e5/6e4); return d?`${d} día${d>1?"s":""} e ${h} h`:h?`${h} h e ${m} min`:`${m} min`; }
const LET="ABCDEF";
function V(){ const v=SHARED.votacion; if(v&&!v.pechada&&v.ata&&Date.now()>v.ata) return {...v,porPechar:true}; return v; }
function resultsText(v){ const tot=v.total||0, entries=v.opcions.map((o,i)=>[LET[i],o,(v.resultados||{})[o]||0]); const max=Math.max(...entries.map(e=>e[2])); const wins=entries.filter(e=>e[2]===max&&max>0);
  return `*TOMIÑO F.C. VETERANOS · Resultado da votación*\n${v.pregunta}\n\n`+entries.map(e=>`${e[0]}) ${e[1]}: *${e[2]}*`).join("\n")+`\n\n${wins.length===1?"Gaña a opción "+wins[0][0]+": "+wins[0][1]:wins.length?"Empate":"Sen votos"} (${tot} votos)`; }
function inviteText(v){ return `*TOMIÑO F.C. VETERANOS · Votación*\n${v.pregunta}\n\nVoto anónimo e só unha vez por persoa 👉 ${SITE}votacion.html\nPecha o ${fmtAta(v.ata)}.`; }

function render(){
  const v=V();
  $("#sync").textContent=syncText();
  $("#banner").innerHTML=!apiReady()?`<div class="banner">A páxina non está conectada á folla compartida.</div>`:SHARED.error==="red"&&!SHARED.at?`<div class="banner err">Non se puido cargar a votación. Comproba a conexión e recarga.</div>`:"";
  let h="";
  if(!v){ h=`<h2>Non hai ningunha votación aberta</h2><p class="muted">Cando o adestrador prepare unha, aparecerá aquí e no grupo de WhatsApp.</p>`; }
  else if(!v.pechada&&!v.porPechar){
    h=`<div class="row between"><span class="state open">● Aberta</span><span class="note">Pecha en <b>${quedan(v.ata)}</b></span></div>
      <p class="q">${esc(v.pregunta)}</p>
      <ol class="optlist">${v.opcions.map((o,i)=>`<li><b>${LET[i]}</b><span>${esc(o)}</span></li>`).join("")}</ol>
      <a class="votebtn" href="${esc(v.url)}" target="_blank" rel="noopener">Votar</a>
      <p class="note">Ábrese un formulario de Google. Pídeche entrar coa túa conta de Google só para que ninguén poida votar dúas veces: o formulario non garda o teu correo e ninguén pode ver que votaches. Se cambias de idea, podes volver entrar e cambiar o voto ata que peche.</p>
      <div class="count"><b>${v.total||0}</b><span class="muted">${(v.total||0)===1?"persoa votou":"persoas votaron"} ata agora</span></div>
      <p class="note">Pecha o <span class="deadline">${esc(fmtAta(v.ata))}</span>. O resultado verase aquí nese momento.</p>`;
  } else if(v.porPechar){
    h=`<span class="state closed">Pechando…</span><p class="q">${esc(v.pregunta)}</p><p class="muted">Rematou o prazo. Recargando o resultado…</p>`;
  } else {
    const tot=v.total||0, entries=v.opcions.map((o,i)=>({k:LET[i],o,n:(v.resultados||{})[o]||0})); const max=Math.max(...entries.map(e=>e.n)); const wins=entries.filter(e=>e.n===max&&max>0);
    h=`<div class="row between"><span class="state closed">Pechada</span><span class="note">${tot} votos</span></div>
      <p class="q">${esc(v.pregunta)}</p>
      <div class="res">${entries.map(e=>`<div class="ritem ${wins.length===1&&wins[0].k===e.k?"win":""}"><span class="l">${e.k}</span><span>${esc(e.o)}</span><span class="n">${e.n}</span><div class="bar"><i style="width:${tot?Math.round(e.n/tot*100):0}%"></i></div></div>`).join("")}</div>
      ${tot===0?`<p class="muted">Non votou ninguén.</p>`:wins.length===1?`<p><span class="chip gold">Gaña a opción ${wins[0].k}</span> ${esc(wins[0].o)} (${Math.round(wins[0].n/tot*100)}%).</p>`:`<p class="muted">Empate. Pódese repetir a votación ou que decida o adestrador.</p>`}`;
  }
  $("#main").innerHTML=h;
}
onShared=()=>{ const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)) return; render(); };
render();
apiGet().then(render);
setInterval(()=>{ if(!document.hidden){ const v=V(); if(v&&v.porPechar) apiGet().then(render); else if(!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))) apiGet().then(render); } },30000);
setInterval(()=>{ const v=V(); if(v&&!v.pechada&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) apiGet().then(render); });
</script>
