<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votación Tomiño F.C. Veteranos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: urna a pantalla completa; el teléfono pasa de mano en mano y el delegado abre el recuento con PIN */
:root{
  --bg:#f6f3f3; --surface:#ffffff; --ink:#1d1414; --muted:#6c5858; --line:#e4d9d9;
  --grana:#8a1712; --grana-deep:#4f0c0a; --grana-ink:#ffffff; --gold:#d9a521; --soft:#f3e7e6; --ok:#2d7a46;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --soft:#2b1a19; --ok:#4fae6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --soft:#2b1a19; --ok:#4fae6c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
p,.just{text-align:justify;hyphens:auto}
header{background:radial-gradient(120% 140% at 15% 0%, var(--grana) 0%, var(--grana-deep) 75%);color:var(--grana-ink);padding:20px 16px 22px;display:flex;align-items:center;gap:16px}
header img{width:76px;height:auto;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);flex:none}
header .club{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;opacity:.85}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.05;margin:2px 0 0;text-transform:uppercase;text-wrap:balance}
main{padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;text-transform:uppercase;margin:0;line-height:1.15;text-wrap:balance}
h3{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:0;cursor:pointer;font:inherit;overflow:hidden;transition:transform .12s ease,border-color .12s ease}
.opt:hover{border-color:var(--grana)}
.opt:active{transform:scale(.985)}
.opt .letter{font-family:var(--display);font-weight:700;font-size:2.4rem;display:grid;place-items:center;width:64px;flex:none;background:var(--grana);color:var(--grana-ink)}
.opt .txt{padding:12px 14px 12px 0;min-width:0}
.opt strong{display:block;font-size:1.08rem;margin-bottom:2px}
.opt .d{display:block;color:var(--muted);text-align:justify;hyphens:auto}
.btn{border:0;border-radius:10px;padding:12px 18px;font:700 1rem var(--body);cursor:pointer;background:var(--grana);color:var(--grana-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:16px 22px;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.center{align-items:center;text-align:center}
.bigletter{font-family:var(--display);font-weight:700;font-size:5rem;line-height:1;color:var(--grana)}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:pop .35s ease}
.tick svg{width:46px;height:46px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.counter{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res{display:grid;gap:14px}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums}
.ritem .l{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--grana);width:1.2em}
.ritem .n{font-family:var(--display);font-weight:700;font-size:1.6rem}
.ritem .bar{grid-column:1/-1;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.ritem .bar i{display:block;height:100%;background:var(--grana);border-radius:7px;transition:width .6s ease}
.ritem.win .bar i{background:var(--gold)}
.ritem.win .l{color:var(--gold)}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--soft);font-variant-numeric:tabular-nums}
.chip.gold{background:var(--gold);color:#2a1d00}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.pin{font-family:var(--display);font-size:1.8rem;letter-spacing:.5em;text-align:center;width:9em}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.keypad button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.4rem var(--display);cursor:pointer}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--grana)}
.dots i.on{background:var(--grana)}
.err{color:var(--grana);font-weight:700;min-height:1.5em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.home{color:var(--grana-ink);font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;align-self:flex-start;flex:none}
.link{background:none;border:0;color:var(--muted);font:600 .95rem var(--body);text-decoration:underline;cursor:pointer;padding:6px 0}
@media (min-width:760px){.opts{grid-template-columns:repeat(3,1fr)}.opt{flex-direction:column}.opt .letter{width:100%;height:64px}.opt .txt{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div style="flex:1;min-width:0"><div class="club">Tomiño F.C. Veteranos</div><h1>Como facemos a convocatoria?</h1></div><a class="home" href="entrenador.html">Volver</a>
</header>
<main id="app"></main>

<script>
const OPTS = {
  A:{t:"Imos todos os dispoñibles", d:"Cada sábado xoga todo o que poida. Haberá máis cambios e menos minutos por cabeza, pero ninguén queda na casa."},
  B:{t:"Máximo 18 con rotación", d:"Se somos 18 ou menos, imos todos. Se somos máis, descansan os que levan máis partidos e o sábado seguinte teñen praza asegurada."},
  C:{t:"Máximo 18 escollidos polo adestrador", d:"O adestrador convoca 18 cada semana segundo o seu criterio, buscando o equipo máis competitivo."}
};
const KEY="tomino_votacion_v1";
let S = load() || {pin:"", fichas:28, votes:{A:0,B:0,C:0}, closed:false};
let view = S.pin ? "urna" : "setup", pick=null, pinBuf="", pinErr="", resetAsk=false, nextTimer=null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const total = ()=>S.votes.A+S.votes.B+S.votes.C;
const $ = s=>document.querySelector(s);

function render(){
  const app=$("#app"); let h="";
  if(view==="setup"){
    h=`<div class="panel"><h2>Preparar a urna</h2>
    <p class="muted">Esta votación funciona nun só móbil ou tableta que se vai pasando de man en man no vestiario. Cada compañeiro vota en privado e a pantalla límpase para o seguinte. Ninguén pode ver que votou cada un.</p>
    <p class="muted">O delegado escolle un PIN de 4 cifras para abrir o reconto ao final. Sen o PIN, ninguén ve os resultados parciais.</p>
    <div class="row"><label class="f" for="inPin">PIN do delegado (4 cifras)<input id="inPin" class="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off"></label>
    <label class="f" for="inFichas">Fichas do equipo<input id="inFichas" type="number" min="1" max="60" value="${S.fichas}" style="width:6em"></label></div>
    <div class="err" id="setupErr"></div>
    <div class="row"><button class="btn big" data-a="start">Abrir a urna</button></div></div>`;
  }
  else if(view==="urna"){
    if(S.closed){
      h=`<div class="panel center"><h2>Votación pechada</h2><p class="muted">O delegado pechou a urna. Pídelle que amose o resultado.</p></div>`;
    } else {
      h=`<p class="muted">Le as tres opcións e toca a que prefiras. O teu voto é secreto. Gaña a máis votada e probámola durante 6 xornadas antes de revisala.</p>
      <div class="opts">${Object.keys(OPTS).map(k=>`<button class="opt" data-a="pick" data-k="${k}"><span class="letter">${k}</span><span class="txt"><strong>${OPTS[k].t}</strong><span class="d">${OPTS[k].d}</span></span></button>`).join("")}</div>`;
    }
    h+=`<div class="foot"><span class="counter">${total()} de ${S.fichas} votaron</span><button class="link" data-a="admin">Reconto (delegado)</button></div>`;
  }
  else if(view==="confirm"){
    h=`<div class="panel center"><h3>A túa elección</h3><div class="bigletter">${pick}</div><h2>${OPTS[pick].t}</h2>
    <p class="muted">${OPTS[pick].d}</p>
    <div class="row" style="justify-content:center"><button class="btn big" data-a="cast">Confirmar voto</button><button class="btn ghost big" data-a="back">Cambiar</button></div></div>`;
  }
  else if(view==="done"){
    h=`<div class="panel center"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Voto rexistrado</h2><p class="muted">Grazas. Pásalle o móbil ao seguinte compañeiro.</p>
    <span class="counter">${total()} de ${S.fichas} votaron</span>
    <button class="btn big" data-a="next">Seguinte votante</button></div>`;
  }
  else if(view==="pin"){
    h=`<div class="panel center"><h2>Reconto</h2><p class="muted">Introduce o PIN do delegado.</p>
    <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div>
    <div class="err">${pinErr}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="key" data-n="${n}">${n}</button>`).join("")}<button data-a="key" data-n="del" aria-label="Borrar">←</button><button data-a="key" data-n="0">0</button><button data-a="cancelPin" aria-label="Volver">✕</button></div></div>`;
  }
  else if(view==="results"){
    const t=total(), max=Math.max(...Object.values(S.votes));
    const winners=Object.keys(S.votes).filter(k=>S.votes[k]===max && max>0);
    const pct=S.fichas?Math.round(t/S.fichas*100):0;
    h=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Resultado</h2><span class="chip">${t} votos · ${pct}% de participación</span></div>
    <div class="res">${Object.keys(OPTS).map(k=>{const v=S.votes[k];const p=t?Math.round(v/t*100):0;return `<div class="ritem ${winners.length===1&&winners[0]===k?"win":""}"><span class="l">${k}</span><span>${OPTS[k].t}</span><span class="n">${v}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
    ${t===0?`<p class="muted">Aínda non votou ninguén.</p>`:winners.length===1?`<p><span class="chip gold">Gaña a opción ${winners[0]}</span> ${OPTS[winners[0]].t}.</p>`:`<p class="muted">Hai empate entre as opcións ${winners.join(" e ")}. Pódese repetir a votación só entre elas ou que decida o adestrador.</p>`}</div>
    <div class="row">
      <button class="btn" data-a="toggleClose">${S.closed?"Reabrir a urna":"Pechar a urna"}</button>
      <button class="btn ghost" data-a="toUrna">Volver á urna</button>
      ${resetAsk?`<span class="muted">Borraranse todos os votos.</span><button class="btn" data-a="resetYes">Si, empezar de cero</button><button class="btn ghost" data-a="resetNo">No</button>`:`<button class="btn ghost" data-a="reset">Nova votación</button>`}
    </div>`;
  }
  app.innerHTML=h;
  if(view==="setup") setTimeout(()=>{const i=$("#inPin"); if(i) i.focus();},50);
}

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-a]"); if(!b) return; const a=b.dataset.a;
  if(a==="start"){
    const p=$("#inPin").value.trim(), f=parseInt($("#inFichas").value)||28;
    if(!/^\d{4}$/.test(p)){ $("#setupErr").textContent="O PIN ten que ter 4 cifras."; return; }
    S={pin:p,fichas:f,votes:{A:0,B:0,C:0},closed:false}; save(); view="urna";
  }
  if(a==="pick"){ pick=b.dataset.k; view="confirm"; }
  if(a==="back"){ pick=null; view="urna"; }
  if(a==="cast"){ S.votes[pick]++; save(); pick=null; view="done"; clearTimeout(nextTimer); nextTimer=setTimeout(()=>{ if(view==="done"){view="urna";render();} },6000); }
  if(a==="next"){ clearTimeout(nextTimer); view="urna"; }
  if(a==="admin"){ pinBuf=""; pinErr=""; view="pin"; }
  if(a==="cancelPin"){ view="urna"; }
  if(a==="key"){
    const n=b.dataset.n; pinErr="";
    if(n==="del") pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=n;
    if(pinBuf.length===4){ if(pinBuf===S.pin){ view="results"; resetAsk=false; } else { pinErr="PIN incorrecto"; pinBuf=""; } }
  }
  if(a==="toggleClose"){ S.closed=!S.closed; save(); }
  if(a==="toUrna"){ view="urna"; }
  if(a==="reset"){ resetAsk=true; }
  if(a==="resetNo"){ resetAsk=false; }
  if(a==="resetYes"){ try{localStorage.removeItem(KEY)}catch(e){} S={pin:"",fichas:S.fichas,votes:{A:0,B:0,C:0},closed:false}; resetAsk=false; view="setup"; }
  render();
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && view==="setup"){ const b=document.querySelector('[data-a="start"]'); if(b) b.click(); } });
render();
</script>
</body>
</html>
