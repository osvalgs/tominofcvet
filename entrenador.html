<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adestrador Tomiño F.C. Veteranos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8a1712">
<link rel="icon" href="icono_192.png">
<link rel="apple-touch-icon" href="icono_192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: cabecera granate con escudo y próximo partido; contenido a todo el ancho en tarjetas de borde fino */
:root{
  --bg:#f6f3f3; --surface:#ffffff; --ink:#1d1414; --muted:#6c5858; --line:#e4d9d9;
  --grana:#8a1712; --grana-deep:#4f0c0a; --grana-ink:#ffffff; --gold:#d9a521; --gold-ink:#2a1d00; --soft:#f3e7e6;
  --ok:#2d7a46; --no:#9b4a43; --draw:#8c7b52; --pend:#b9a9a7;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19;
  --ok:#4fae6c; --no:#d9776d; --draw:#b3a374; --pend:#6f6260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c0c; --surface:#1f1414; --ink:#f2e9e8; --muted:#b39c9a; --line:#3a2827;
  --grana:#b3271f; --grana-deep:#2a0807; --grana-ink:#ffffff; --gold:#e8b93a; --gold-ink:#2a1d00; --soft:#2b1a19;
  --ok:#4fae6c; --no:#d9776d; --draw:#b3a374; --pend:#6f6260; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
p{text-align:justify;hyphens:auto;margin:0}
a{color:inherit}
.hero{background:radial-gradient(120% 140% at 10% 0%, var(--grana) 0%, var(--grana-deep) 80%);color:var(--grana-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:auto;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);flex:none}
.brand .sub{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;opacity:.85}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.05;margin:2px 0 0;text-transform:uppercase}
.brand .grow{flex:1;min-width:0}
.pill-link{color:var(--grana-ink);font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;font-size:.9rem;flex:none;align-self:flex-start}
.next{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.next .lbl{font:700 .75rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.next .vs{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,5.4vw,2rem);line-height:1.15;text-transform:uppercase;text-wrap:balance}
.next .meta{opacity:.95;font-size:1.02rem}
.next .meta b{font-weight:700}
.next .aviso{background:var(--gold);color:var(--gold-ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.9rem;text-align:justify}
.next .nota{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:.95rem;text-align:justify}
.maps{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--grana-deep);font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;align-self:flex-start}
.maps svg{width:18px;height:18px}
main{padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;text-transform:uppercase;margin:0;line-height:1.15;text-wrap:balance}
h3{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.muted{color:var(--muted)} .note{font-size:.88rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 .95rem var(--body);cursor:pointer;background:var(--grana);color:var(--grana-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;background:var(--soft);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok);color:#fff} .chip.no{background:var(--no);color:#fff} .chip.gold{background:var(--gold);color:var(--gold-ink)} .chip.grana{background:var(--grana);color:var(--grana-ink)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:600;font-size:1.1rem;width:2.2ch;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--body);padding:7px 11px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.y{background:var(--ok);color:#fff}
.seg button.on.n{background:var(--no);color:#fff}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;text-align:justify;background:color-mix(in srgb,var(--gold) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.banner.err{background:color-mix(in srgb,var(--no) 14%,var(--surface));border-color:color-mix(in srgb,var(--no) 40%,transparent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;text-align:center;z-index:20}
.sync{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.card.y{background:#f2c200} .card.r{background:#d8261c}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#08331a;font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;border:0;font-size:.95rem;cursor:pointer}
.wa svg{width:18px;height:18px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--gold-ink);flex:none}

nav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding-top:env(safe-area-inset-top,0px)}
nav button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 .98rem var(--body);padding:13px 14px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--grana)}
section.tab{display:flex;flex-direction:column;gap:16px}
.status{border-radius:12px;padding:12px 14px;font-weight:600;text-align:justify}
.status.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.status.over{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.shirts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.shirt{position:relative;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.shirt svg{width:72px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.shirt .sn{font-size:.82rem;font-weight:600;text-align:center;line-height:1.2;overflow-wrap:anywhere;max-width:100%}
.shirt .badge{position:absolute;top:-4px;right:2px;background:var(--gold);color:var(--gold-ink);font-size:.64rem;font-weight:700;border-radius:999px;padding:1px 6px}
.shirt .badge.l{left:2px;right:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.shirt.bench svg path{fill:var(--soft);stroke:var(--line)}
.shirt.bench text{fill:var(--muted)}
.pubok{border:2px solid var(--ok)}
.seg4{display:grid;grid-template-columns:repeat(4,auto);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg4 button{border:0;background:var(--surface);color:var(--muted);font:600 .78rem var(--body);padding:7px 7px;cursor:pointer}
.seg4 button + button{border-left:1px solid var(--line)}
.seg4 button.on.va{background:var(--ok);color:#fff}
.seg4 button.on.tarde,.seg4 button.on.antes{background:var(--gold);color:var(--gold-ink)}
.seg4 button.on.no{background:var(--no);color:#fff}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;background:var(--surface)}
th[aria-sort]{color:var(--grana)}
td.n,th.n{text-align:left}
td.num{font-family:var(--display);font-weight:600;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.strip{display:flex;gap:3px;justify-content:center}
.strip i{width:20px;height:20px;border-radius:4px;font:700 .68rem/20px var(--body);font-style:normal;color:#fff;text-align:center}
.strip i.T{background:var(--grana)} .strip i.S{background:var(--gold);color:var(--gold-ink)} .strip i.X{background:var(--soft);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted);align-items:center}
.legend .strip{justify-content:flex-start}
.fx{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.fx>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.fx .jd{font-family:var(--display);font-weight:600;text-align:center;line-height:1.1;width:3.2em}
.fx .jd small{display:block;font:600 .72rem var(--body);color:var(--muted)}
.res{font-family:var(--display);font-weight:700;border-radius:8px;padding:2px 10px;color:#fff;min-width:3.4em;text-align:center}
.res.W{background:var(--ok)} .res.D{background:var(--draw)} .res.L{background:var(--no)} .res.P{background:var(--soft);color:var(--muted);font:600 .8rem var(--body)}
.detail{padding:0 14px 14px}
.detail ul{margin:6px 0 0;padding-left:1.1em}
textarea{width:100%;min-height:150px}
.pitch{position:relative;width:100%;max-width:520px;aspect-ratio:68/100;margin:0 auto;border-radius:12px;background:repeating-linear-gradient(0deg,#2f7d3c 0 10%,#2a7236 10% 20%);border:2px solid #e8f2e8;overflow:hidden}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.7)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);z-index:2;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:22%}
.slot b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .82rem var(--display);background:rgba(255,255,255,.85);color:#1d3b22;border:2px dashed #1d3b22}
.slot.full b{background:var(--grana);color:#fff;border:2px solid #fff;font-size:1rem}
.slot.sel b{outline:3px solid var(--gold);outline-offset:2px}
.slot span{font:700 .72rem var(--body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.pk{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font:600 .85rem var(--body);cursor:pointer}
.pk.used{opacity:.6} .pk.far{border-style:dashed;color:var(--muted)} .pk.out{background:var(--no);color:#fff;border-color:var(--no)}
.mins input.min{width:4.6em;text-align:center}
.mini.les.on{background:var(--no);color:#fff;border-color:var(--no)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:4}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpis b{font-family:var(--display);font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.kpis span{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpis.small b{font-size:1.15rem}
tr.prow{cursor:pointer} tr.prow.sel td{background:var(--soft)}
.ficha{border:2px solid var(--grana)}
textarea{min-height:0}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;width:32px;height:32px;font-weight:700;cursor:pointer;flex:none}
footer{padding:0 16px 30px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--muted)}
</style>
</head>

/* Contadores para a rotación: actas oficiais + convocatorias publicadas sen acta aínda */
function counters(beforeDate){
  const C={};
  DATA.plantilla.forEach(p=>C[p.nombre]={conv:p.convocado,desc:0,lastOut:""});
  const pubs=SHARED.convocatorias.filter(c=>c.fecha<beforeDate).sort((a,b)=>a.fecha<b.fecha?-1:1);
  pubs.forEach(c=>{
    if(!playedDates.has(c.fecha)) c.convocados.forEach(n=>{ if(C[n]) C[n].conv++; });
    c.descansan.forEach(n=>{ if(C[n]){ C[n].desc++; C[n].lastOut=c.fecha; } });
  });
  return {C,lastPub:pubs.length?pubs[pubs.length-1].fecha:""};
}
const av=(f,n)=>(SHARED.avail[f]||{})[n]||"";
function proposal(c){
  const lim=Number(L.limit)||18, J=jugadores(), avail=J.filter(p=>VAI(av(c.fecha,p.nombre)));
  const {C,lastPub}=counters(c.fecha), f=new Set(L.forced[c.fecha]||[]);
  const by=(a,b)=>nice(a.nombre).localeCompare(nice(b.nombre),"gl");
  if(avail.length<=lim) return {inn:avail,out:[],avail,over:false,C,lastPub};
  const outLast=p=>C[p.nombre].lastOut&&C[p.nombre].lastOut===lastPub?1:0;
  const s=avail.slice().sort((a,b)=>(f.has(b.nombre)-f.has(a.nombre))||outLast(b)-outLast(a)||C[b.nombre].desc-C[a.nombre].desc||C[a.nombre].conv-C[b.nombre].conv||by(a,b));
  return {inn:s.slice(0,lim).sort(by),out:s.slice(lim).sort(by),avail,over:true,C,lastPub};
}
function reason(p,C,lastPub){ const c=C[p.nombre]; if(c.lastOut&&c.lastOut===lastPub) return "descansou a última vez"; return `${c.conv} convocatorias · ${c.desc} descansos`; }

/* ---------- Estatísticas por xogador ---------- */
function playerStats(){
  const {C}=counters("9999"), ms=DATA.partidos, n=ms.length;
  return DATA.plantilla.map(p=>{
    let min=0, conMin=0, les=0; const posC={}; const det=[];
    ms.forEach(m=>{ const t=m.titulares.some(x=>x.nombre===p.nombre), s=m.suplentes.some(x=>x.nombre===p.nombre), sg=SEG[m.fecha];
      const mi=sg&&sg.minutos&&sg.minutos[p.nombre]!=null&&sg.minutos[p.nombre]!==""?Number(sg.minutos[p.nombre]):null;
      let po=""; if(sg&&sg.once){ const i=sg.once.indexOf(p.nombre); if(i>=0) po=(SISTEMAS[sg.sistema]||SISTEMAS["4-4-2"])[i][0]; }
      if(mi!=null){ min+=mi; conMin++; } if(po) posC[po]=(posC[po]||0)+1; if(sg&&sg.lesion&&sg.lesion[p.nombre]) les++;
      det.push({m,rol:t?"T":s?"S":"X",min:mi,pos:po,goles:m.goles.filter(g=>g.nombre===p.nombre&&g.tipo!=="propia").length,tar:m.tarjetas.filter(x=>x.nombre===p.nombre)});
    });
    const posTop=Object.entries(posC).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    return {...p,desc:C[p.nombre].desc,pct:n?Math.round(p.convocado/n*100):0,min,media:conMin?Math.round(min/conMin):null,les,posTop,det};
  });
}

function lineupText(c,d){

function resultsText(){

function statsText(){
  const rows=playerStats(), n=DATA.partidos.length;
  const gol=rows.filter(p=>p.goles>0).sort((a,b)=>b.goles-a.goles);
  let t=`*TOMIÑO F.C. VETERANOS · Estatísticas* (${n} partidos)\n`;
  if(gol.length) t+=`\n*Goleadores:* ${gol.map(p=>corto(p.nombre)+" "+p.goles).join(", ")}\n`;
  const hasMin=rows.some(p=>p.min>0);
  t+=`\n*Xogador · conv. · titular${hasMin?" · min":""}*\n`;
  rows.slice().sort((a,b)=>b.convocado-a.convocado||(b.min-a.min)||nice(a.nombre).localeCompare(nice(b.nombre),"gl")).forEach(p=>{
    t+=`${p.dorsal!=null?p.dorsal+". ":""}${corto(p.nombre)}: ${p.convocado}/${n} · ${p.titular}${hasMin?" · "+(p.min||0):""}${p.goles?" · ⚽"+p.goles:""}\n`; });

}

  if(a==="saveMatch"){ const hora=$("#inHora").value, nota=$("#inNota").value.trim(), p=SHARED.partidos[c.fecha]||{};
    const def=nota===notaPorDefecto(p.hora||c.hora||"")||nota===notaPorDefecto(hora);
    await withPin({action:"partido",fecha:c.fecha,hora,nota:def?"__defecto__":nota},"Hora e aviso gardados"); render(); return; }
  if(a==="pinToggle"){ const s=$("#pinShow"), on=s.dataset.on!=="1"; s.dataset.on=on?"1":"0"; s.textContent="PIN: "+(on?L.pin:"••••"); b.textContent=on?"Ocultar":"Amosar"; return; }
  if(a==="changePin"){ const n1=$("#inNew").value.trim(), n2=$("#inNew2").value.trim();
    if(n1.length<4){ toast("O PIN ten que ter polo menos 4 caracteres"); return; }
    if(n1!==n2){ toast("Os dous PIN non coinciden"); return; }
    try{ await apiPost({action:"cambiarPin",pin:L.pin,nuevo:n1}); L.pin=n1; L.ok=true; saveL(); toast("PIN cambiado"); render(); }
    catch(x){ toast(x&&x.error==="pin"?"O PIN actual non é válido":x&&x.error==="acción desconocida"?"Primeiro hai que actualizar o script da folla de Google":"Non se puido cambiar. Téntao de novo."); }
    return; }
  if(a==="checkPin"){ L.pin=$("#inPin").value.trim(); saveL(); if(!L.pin) return; await withPin({action:"comprobarPin"},"PIN correcto"); render(); return; }
});
document.addEventListener("input",e=>{
  const t=e.target; if(!UI.draft) return;
  if(t.dataset&&t.dataset.k){ UI.draft.d[t.dataset.k]=t.value; markDirty(); }
  if(t.dataset&&t.dataset.min!==undefined){ UI.draft.d.minutos[t.dataset.min]=t.value===""?"":Math.max(0,parseInt(t.value)||0); markDirty(); }
  if(t.id==="inDur"){ UI.draft.d.duracion=parseInt(t.value)||80; markDirty(); }
});
document.addEventListener("click",e=>{ const r=e.target.closest("tr.prow"); if(r){ UI.player=UI.player===r.dataset.p?null:r.dataset.p; render(); const f=$("#ficha"); if(f&&UI.player) f.scrollIntoView({behavior:"smooth",block:"start"}); } });
document.addEventListener("change",e=>{
  if(e.target.id==="inSegFx"){ if(UI.draft&&UI.draft.dirty&&!window.__segAsk){ toast("Garda antes os cambios deste partido"); e.target.value=UI.draft.fecha; return; } L.segFecha=e.target.value; UI.slot=null; saveL(); render(); }
  if(e.target.id==="inSis"){ UI.draft.d.sistema=e.target.value; markDirty(); render(); }
  if(e.target.id==="inFx"){ L.fecha=e.target.value; UI.confirm=false; saveL(); render(); }
  if(e.target.id==="inLimit"){ L.limit=Math.max(11,Math.min(30,parseInt(e.target.value)||18)); saveL(); render(); }
});
/* Acceso co PIN: compróbase coa folla de Google antes de amosar nada */
async function entrar(pin){
  const msg=$("#gMsg"); msg.textContent="Comprobando…";
  try{ await apiPost({action:"comprobarPin",pin}); L.pin=pin; L.ok=true; saveL(); $("#gate").hidden=true; $("#app").hidden=false; render(); loadSeg().then(render); }
  catch(e){ L.ok=false; saveL(); msg.textContent=e&&e.error==="pin"?"PIN incorrecto.":"Non se puido comprobar. Revisa a conexión."; }
}
$("#gGo").addEventListener("click",()=>{ const p=$("#gPin").value.trim(); if(p) entrar(p); });
$("#gPin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#gGo").click(); });
$("#logout").addEventListener("click",e=>{ e.preventDefault(); L.pin=""; L.ok=false; saveL(); location.reload(); });
if(L.ok&&L.pin){ $("#app").hidden=false; render(); loadSeg().then(()=>{ if(!$("#app").hidden) render(); });
  apiPost({action:"comprobarPin",pin:L.pin}).catch(x=>{ if(x&&x.error==="pin"){ L.ok=false; saveL(); $("#app").hidden=true; $("#gate").hidden=false; $("#gMsg").textContent="O PIN cambiou. Escribe o novo."; } }); }
else { $("#gate").hidden=false; }
apiGet().then(()=>{ if(!$("#app").hidden) render(); });
setInterval(()=>{ if(!$("#app").hidden && !document.hidden && !(UI.draft&&UI.draft.dirty) && !UI.copy && !UI.confirm && !(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) apiGet().then(render); },60000);
</script>
</body>
